[package]
name = "reopencode"
version = "0.1.0"
edition = "2024"
authors = ["ReOpenCode Team"]
license = "MIT"
description = "Rust rewrite of opencode + oh-my-openagent"

[dependencies]
# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# CLI
clap = { version = "4", features = ["derive"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# HTTP
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Database
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP Client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Async Stream
futures = "0.3"
async-stream = "0.3"

# Utility
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
dirs = "5"
once_cell = "1"
lazy_static = "1"
uuid = { version = "1", features = ["v4"] }
camino = "1.2.2"
base64 = "0.22.1"
fnv = "1.0.7"
globset = "0.4.18"
walkdir = "2"
shellexpand = "3"
dashmap = "6.1.0"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
